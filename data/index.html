      <div class="card">
        <div class="card-body">
          <div class="form-group">
            <label>Wifi</label>
            <br />
            <label for="wifi_ssid">SSID</label>
            <input type="text" id="wifi_ssid" class="form-control" value="">
            <label for="wifi_password">Password</label>
            <input type="text" id="wifi_password" class="form-control" value="">
          </div>
          <button type="button" class="btn btn-primary" onclick="setWifiConfig()">Update Wifi Config</button>
          <form id="form" action="/reboot" method="GET">
            <button type="submit" class="btn btn-primary">Reboot</button>
          </form>          
        </div>
      </div>


      <div class="card-deck">
        <div class="card">
          <div class="card-body">
            <div class="form-group">
              <input type="text" id="clock_color" class="form-control demo" data-inline="true" value="#ff0000">
            </div>
            <button type="button" class="btn btn-primary" onclick="setClockColor()">Set clock color</button>
          </div>
        </div>
        <div class="card">
          <div class="card-body">
            <div class="form-group">
              <input type="text" id="temp_color" class="form-control demo" data-inline="true" value="#ff0000">
            </div>
            <button type="button" class="btn btn-primary" onclick="setTempColor()">Set temp color</button>
          </div>
        </div>
        <div class="card">
          <div class="card-body">
            <div class="form-group">
              <input type="text" id="other_color" class="form-control demo" data-inline="true" value="#ff0000">
            </div>
            <button type="button" class="btn btn-primary" onclick="setOtherColor()">Set other color</button>
          </div>
        </div>
      </div>
      <br />
      <div class="card">
        <div class="card-body">
          <div class="form-group">
            <label for="rangeBrightness">Brightness</label>
            <input type="range" class="form-control-range" id="rangeBrightness" min="10" max="255" value="255">
          </div>
          <button type="button" class="btn btn-primary" onclick="setBrightness()">Update Brightness</button>
          <br /><br />
          <div class="form-group">
            <label for="autoBrightness">Automatic brightness</label>
            <input type="checkbox" id="autoBrightness" name="autoBrightness" value="on">
          </div>
        </div>
      </div>
      <br />

      <div class="card">
        <div class="card-body">
          <div class="form-group">
            <label>Temperature</label>
            <br />
            <label for="hassBaseUrl">HA base URL</label>
            <input type="text" id="hassBaseUrl" class="form-control" value="" placeholder="http://homeassistant.local:8123">
            <label for="hassEntityId">HA entity Id</label>
            <input type="text" id="hassEntityId" class="form-control" value="" placeholder="sensor.living_room_temp">
            <label for="hassAT">HA access token</label>
            <input type="text" id="hassAT" class="form-control" value="">
          </div>
          <button type="button" class="btn btn-primary" onclick="sethassConfig()">Update Temp Config</button>
        </div>
      </div>
      <br />
      <div class="card">
        <div class="card-body">
          <div class="form-group">
            <label>Display message</label>
            <br />
            <label for="messageText">Text</label>
            <input type="text" id="messageText" class="form-control" value="">
            <label for="scrollDelay (ms)">Scroll delay</label>
            <input type="text" id="scrollDelay" class="form-control" value="50">
            <label for="repeatCount">Repeat count</label>
            <input type="text" id="repeatCount" class="form-control" value="1">
          </div>
          <button type="button" class="btn btn-primary" onclick="showMessage()">Display</button>
        </div>
      </div>
      <br />
      <div class="card-deck">
        <div class="card">
          <div class="card-body">
            <div class="form-group">
              <br />
              <label for="forceTemp">Temperature</label>
              <input type="text" id="forceTemp" class="form-control" value="">
            </div>
            <button type="button" class="btn btn-primary" onclick="forceTemp()">Force Temp</button>
          </div>
        </div>
        <div class="card">
          <div class="card-body">
            <div class="form-group">
              <br />
              <label for="forceTime">Time</label>
              <input type="text" id="forceTime" class="form-control" value="">
            </div>
            <button type="button" class="btn btn-primary" onclick="forceTime()">Force Time</button>
            <button type="button" class="btn btn-primary" onclick="syncTime()">Sync Time</button>
          </div>
        </div>
        <div class="card">
          <div class="card-body">
            <div class="form-group">
              <br />
              <label>Beep</label>
            </div>
            <button type="button" class="btn btn-primary" onclick="beep1()">Single</button>
            <button type="button" class="btn btn-primary" onclick="beep2()">Double</button>
          </div>
        </div>
      </div>
      <br />
      <div class="card">
        <div class="card-body">
          <a href="/update">OTA Update</a>
        </div>
      </div>
      <br />
      <p class="text-muted" id="fwVersion"></p>
    </div>
